# Publica site-piloto/ no GitHub Pages a cada push na main que mude o site.
# O site já sai pronto do pipeline (python pipeline\construir.py): aqui só se envia a pasta.
name: Publicar site-piloto

on:
  push:
    branches: [main]
    paths:
      - "site-piloto/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-piloto
      - id: deploy
        uses: actions/deploy-pages@v4
